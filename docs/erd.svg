<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .box { fill: #ffffff; stroke: #2b6cb0; stroke-width: 2; }
    .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1a202c; }
    .col { font-family: Arial, sans-serif; font-size: 12px; fill: #2d3748; }
    .line { stroke: #4a5568; stroke-width: 2; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568" />
    </marker>
  </defs>

  <!-- USERS -->
  <rect class="box" x="520" y="40" width="360" height="120" rx="6" />
  <text class="title" x="540" y="64">users</text>
  <text class="col" x="540" y="88">id PK</text>
  <text class="col" x="640" y="88">name</text>
  <text class="col" x="540" y="108">email</text>
  <text class="col" x="640" y="108">password</text>

  <!-- PROFILES -->
  <rect class="box" x="960" y="40" width="320" height="140" rx="6" />
  <text class="title" x="980" y="64">profiles</text>
  <text class="col" x="980" y="88">id PK</text>
  <text class="col" x="1080" y="88">user_id FK</text>
  <text class="col" x="980" y="108">profile_picture</text>
  <text class="col" x="980" y="128">bio, phone, address</text>

  <!-- BOOKS -->
  <rect class="box" x="520" y="420" width="420" height="220" rx="6" />
  <text class="title" x="540" y="448">books</text>
  <text class="col" x="540" y="472">id PK</text>
  <text class="col" x="640" y="472">title</text>
  <text class="col" x="540" y="492">author</text>
  <text class="col" x="640" y="492">cover_picture</text>
  <text class="col" x="540" y="512">content_file</text>
  <text class="col" x="640" y="512">total_copies, available_copies</text>
  <text class="col" x="540" y="532">isbn, category, status</text>

  <!-- BOOKLISTS -->
  <rect class="box" x="520" y="280" width="360" height="100" rx="6" />
  <text class="title" x="540" y="304">booklists</text>
  <text class="col" x="540" y="328">id PK</text>
  <text class="col" x="640" y="328">user_id FK</text>
  <text class="col" x="540" y="348">book_id FK</text>
  <text class="col" x="640" y="348">status, notes, user_rating</text>

  <!-- BOOKMARKS -->
  <rect class="box" x="140" y="300" width="300" height="120" rx="6" />
  <text class="title" x="160" y="328">bookmarks</text>
  <text class="col" x="160" y="352">id PK</text>
  <text class="col" x="260" y="352">user_id FK</text>
  <text class="col" x="160" y="372">book_id FK</text>
  <text class="col" x="160" y="392">last_page</text>

  <!-- ABOUTS -->
  <rect class="box" x="1200" y="320" width="360" height="180" rx="6" />
  <text class="title" x="1220" y="344">abouts</text>
  <text class="col" x="1220" y="368">id PK</text>
  <text class="col" x="1320" y="368">title</text>
  <text class="col" x="1220" y="388">description, mission, vision, features</text>

  <!-- MENUS -->
  <rect class="box" x="1200" y="520" width="360" height="140" rx="6" />
  <text class="title" x="1220" y="544">menus</text>
  <text class="col" x="1220" y="568">id PK</text>
  <text class="col" x="1320" y="568">title, slug, type</text>
  <text class="col" x="1220" y="588">url, content, is_active</text>

  <!-- SESSIONS -->
  <rect class="box" x="120" y="520" width="320" height="140" rx="6" />
  <text class="title" x="140" y="544">sessions</text>
  <text class="col" x="140" y="568">id PK</text>
  <text class="col" x="240" y="568">user_id FK</text>
  <text class="col" x="140" y="588">ip_address, user_agent</text>

  <!-- PERSONAL ACCESS TOKENS -->
  <rect class="box" x="120" y="700" width="420" height="140" rx="6" />
  <text class="title" x="140" y="724">personal_access_tokens</text>
  <text class="col" x="140" y="748">id PK</text>
  <text class="col" x="340" y="748">name</text>
  <text class="col" x="140" y="768">tokenable_id, token</text>

  <!-- Relationship lines -->
  <line class="line" x1="700" y1="160" x2="1040" y2="160" />
  <line class="line" x1="680" y1="300" x2="680" y2="420" />
  <line class="line" x1="500" y1="300" x2="440" y2="360" />
  <line class="line" x1="260" y1="360" x2="520" y2="360" />
  <line class="line" x1="340" y1="420" x2="520" y2="420" />
  <line class="line" x1="1100" y1="400" x2="960" y2="400" />
  <line class="line" x1="520" y1="540" x2="520" y2="640" />

  <!-- Labels for relationships -->
  <text class="col" x="760" y="148">has</text>
  <text class="col" x="620" y="360">owns</text>
  <text class="col" x="370" y="396">book</text>

</svg>